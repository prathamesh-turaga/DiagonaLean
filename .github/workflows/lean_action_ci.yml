name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check for vacuous many-one reduction witnesses
        run: ./scripts/check-classical-reductions.sh
      - uses: leanprover/lean-action@v1
